<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

{% if infected %}

<style>

body{
    overflow:hidden;
    animation:shake .1s infinite;
}

@keyframes shake{

0%{transform:translate(1px,1px);}
25%{transform:translate(-2px,1px);}
50%{transform:translate(2px,-1px);}
75%{transform:translate(-1px,-2px);}
100%{transform:translate(1px,-1px);}

}

*{
    pointer-events:none;
}

.virus-box{

    position:fixed;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%);

    background:white;

    width:400px;

    padding:35px;

    border-radius:25px;

    text-align:center;

    z-index:99999;

    box-shadow:
    0 0 40px rgba(0,0,0,.3);
}

.loading{

    margin-top:15px;

    color:red;

    animation:blink .6s infinite;
}

@keyframes blink{

0%{opacity:1;}
50%{opacity:.3;}
100%{opacity:1;}

}

.emoji{

    position:fixed;

    font-size:40px;

    animation:fly 4s linear infinite;
}

@keyframes fly{

0%{
transform:translateY(100vh)
rotate(0deg);
}

100%{
transform:translateY(-120vh)
rotate(360deg);
}

}

</style>

<script>

window.onload = function(){

    const msg = [

        "🐸 Website lagi ngambek",

        "🦆 Bebek cyber menyerang",

        "☕ Server sedang ngopi",

        "💀 Bug liar ditemukan",

        "🐱 Kucing developer tidur",

        "🫠 RAM kehilangan semangat hidup"

    ];

    alert(
        msg[
            Math.floor(
                Math.random() * msg.length
            )
        ]
    );
}

</script>

{% endif %}

</head>

<body class="bg-light">

{% if infected %}

<div class="virus-box">

    <h1>🤡 WEBSITE ERROR</h1>

    <p>
        sistem sedang mengalami
        gangguan receh...
    </p>

    <div class="loading">

        memperbaiki nasib website...

    </div>

</div>

<div class="emoji"
     style="left:10%">
🐸
</div>

<div class="emoji"
     style="left:25%;animation-delay:1s;">
🦆
</div>

<div class="emoji"
     style="left:45%;animation-delay:2s;">
💀
</div>

<div class="emoji"
     style="left:65%;animation-delay:1.5s;">
🐱
</div>

<div class="emoji"
     style="left:85%;animation-delay:.5s;">
☕
</div>

{% endif %}

<nav class="navbar navbar-dark bg-dark">

<div class="container">

    <span class="navbar-brand">

        Timeline Dashboard

    </span>

    <div>

        <span class="text-white me-3">

            Welcome,
            {{ user.username }}

        </span>

        <a href="/logout"
           class="btn btn-danger btn-sm">

           Logout

        </a>

    </div>

</div>

</nav>

<div class="container mt-5">

<div class="card shadow">

<div class="card-body">

<form method="POST"
      action="/create">

<div class="input-group">

<input
    type="text"
    name="content"
    class="form-control"
    placeholder="Write something..."
    required
>

<button
    class="btn btn-primary">

    Submit

</button>

</div>

</form>

</div>

</div>

<div class="mt-4">

{% for p in posts %}

<div class="card mb-3 shadow-sm">

<div class="card-body">

    {{ p[2] }}

</div>

</div>

{% endfor %}

</div>

</div>

</body>
</html>
