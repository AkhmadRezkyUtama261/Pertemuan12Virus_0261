<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background:
    linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{

    width:380px;

    background:white;

    padding:40px;

    border-radius:20px;

    box-shadow:
    0 0 30px rgba(0,0,0,0.2);
}

</style>

</head>

<body>

<div class="login-box">

    <h2 class="text-center mb-4">
        Timeline App
    </h2>

    <form method="POST">

        <input
            type="text"
            name="username"
            class="form-control mb-3"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            class="form-control mb-3"
            placeholder="Password"
            required
        >

        <button
            class="btn btn-primary w-100">

            Login

        </button>

    </form>

</div>

</body>
</html>
